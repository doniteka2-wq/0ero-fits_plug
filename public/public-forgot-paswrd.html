<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password —  Zero fits_plug</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Reset Password</h2>
      <p style="text-align:center;color:#666;margin-top:0;">
        Enter your email to set a new password.
      </p>

      <div id="alertBox"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <div class="form-group" style="margin-top:1rem;">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
          <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.4rem;font-size:0.85rem;font-weight:normal;color:#666;cursor:pointer;">
            <input type="checkbox" id="togglePassword" style="width:auto;margin:0;">
            Show password
          </label>
        </div>

        <button class="btn" type="submit" style="margin-top:1.25rem;">Reset Password</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;">
        <a href="customer-login.html" style="color:#666;font-size:0.85rem;">← Back to login</a>
      </p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('togglePassword');
      const pwd = document.getElementById('password');
      toggle.addEventListener('change', () => {
        pwd.type = toggle.checked ? 'text' : 'password';
      });

      const form = document.getElementById('resetForm');
      const alertBox = document.getElementById('alertBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.innerHTML = '';

        const email = form.email.value.trim();
        const password = form.password.value;

        try {
          const res = await fetch('/api/users/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (res.ok) {
            alertBox.innerHTML = '<div class="alert alert-success">Password updated! Redirecting to login…</div>';
            setTimeout(() => window.location.href = 'customer-login.html', 1200);
          } else {
            alertBox.innerHTML = `<div class="alert alert-error">${data.message || 'Reset failed.'}</div>`;
          }
        } catch (err) {
          alertBox.innerHTML = '<div class="alert alert-error">Server error. Try again.</div>';
        }
      });
    });
  </script>
</body>
</html>
