<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Manager —  Zero fits_plug Admin</title>
   <link rel="icon" href="/my logo.jpg">
  <script>
    (function () {
      if (!localStorage.getItem('adminToken')) {
        window.location.replace('/admin-login.html');
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">🔥 Zero fits_plug admin</div>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/admin-product.html">Products</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </div>

  <div class="admin-container">
    <div class="admin-header">
      <h2>Product Manager</h2>
      <div>Manage your storefront inventory</div>
    </div>

    <div id="alertBox"></div>

    <div class="form-card">
      <h3>Upload New Product</h3>
      <form id="productForm" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" placeholder="Classic  Zero fits_plug Tee" required>
          </div>
          <div class="form-group">
            <label for="price">Price (RWF)</label>
            <input type="number" id="price" name="price" step="0.01" min="0" placeholder="price" required>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="T-Shirts">
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Signature heavyweight cotton tee."></textarea>
        </div>

        <div class="form-group" style="margin-top:1rem;">
          <label for="image">Product Image</label>
          <input type="file" id="image" name="image" accept="image/*" required>
          <small style="color:#888;margin-top:0.35rem;display:block;">JPG, PNG, WEBP or GIF · max 5MB</small>
        </div>

        <button class="btn" type="submit" style="margin-top:1.25rem;">Upload Product</button>
      </form>
    </div>

    <h3>Existing Products</h3>
    <table id="productTable">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    var token = localStorage.getItem('adminToken');
    if (!token) {
      window.location.href = '/boss-login.html';
    }

    var authHeaders = { 'Authorization': 'Bearer ' + token };
    var alertBox = document.getElementById('alertBox');
    var form = document.getElementById('productForm');

    function showAlert(msg, type) {
      if (!alertBox) return;
      alertBox.innerHTML = '<div class="alert alert-' + (type || 'success') + '">' + msg + '</div>';
      setTimeout(function () { alertBox.innerHTML = ''; }, 3500);
    }

    function loadProducts() {
      var tbody = document.querySelector('#productTable tbody');
      fetch('/api/products')
        .then(function (res) { return res.json(); })
        .then(function (products) {
          if (!products.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:2rem;">No products yet. Upload your first one above.</td></tr>';
            return;
          }
          var rows = '';
          for (var i = 0; i < products.length; i++) {
            var p = products[i];
            var img = p.image
              ? '<img src="' + p.image + '" alt="' + p.name + '" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">'
              : '<span style="color:#aaa;">-</span>';
            rows += '<tr>' +
              '<td>' + img + '</td>' +
              '<td>' + p.name + '</td>' +
              '<td>' + (p.category || '-') + '</td>' +
              '<td>' + Number(p.price)+ ' RWF</td>' +
              '<td class="actions-cell">' +
                '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + p.productId + '\')">Delete</button>' +
              '</td>' +
            '</tr>';
          }
          tbody.innerHTML = rows;
        })
        .catch(function (err) {
          console.error('Load failed:', err);
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#c0392b;">Failed to load products.</td></tr>';
        });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var formData = new FormData(form);

      fetch('/api/admin/products', {
        method: 'POST',
        headers: authHeaders,
        body: formData
      })
        .then(function (res) {
          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin-login.html';
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) return;
          if (data.success) {
            showAlert('Product uploaded successfully.', 'success');
            form.reset();
            loadProducts();
          } else {
            showAlert(data.message || 'Upload failed.', 'error');
          }
        })
        .catch(function (err) {
          console.error(err);
          showAlert('Server error. Try again.', 'error');
        });
    });

    function deleteProduct(productId) {
      if (!confirm('Delete this product permanently?')) return;
      fetch('/api/admin/products/' + productId, {
        method: 'DELETE',
        headers: authHeaders
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.success) {
            showAlert('Product deleted.', 'success');
            loadProducts();
          } else {
            showAlert(data.message || 'Delete failed.', 'error');
          }
        })
        .catch(function (err) {
          console.error(err);
          showAlert('Server error. Try again.', 'error');
        });
    }

    document.getElementById('logoutBtn').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('adminToken');
      window.location.href = '/admin-login.html';
    });

    loadProducts();
  </script>
</body>
</html>
