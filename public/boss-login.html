<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Access</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>🔥 Admin Access</h2>
      <p style="text-align:center;color:#b8b8b8;margin-top:0;">
        Restricted area. Authorized staff only.
      </p>

      <div id="alertBox"></div>

      <form id="adminForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-top:1rem;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.4rem;font-size:0.85rem;font-weight:normal;color:#b8b8b8;cursor:pointer;">
            <input type="checkbox" id="togglePassword" style="width:auto;margin:0;">
            Show password
          </label>
        </div>

        <button class="btn" type="submit" style="margin-top:1.25rem;width:100%;">Sign In</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;">
        <a href="/" style="color:#666;font-size:0.85rem;">← Back to store</a>
      </p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Show/hide password toggle
      var toggle = document.getElementById('togglePassword');
      var pwd = document.getElementById('password');
      toggle.addEventListener('change', function () {
        pwd.type = toggle.checked ? 'text' : 'password';
      });

      var form = document.getElementById('adminForm');
      var alertBox = document.getElementById('alertBox');

      function showAlert(msg, type) {
        alertBox.innerHTML = '<div class="alert alert-' + (type || 'error') + '">' + msg + '</div>';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertBox.innerHTML = '';

        var username = form.username.value.trim();
        var password = form.password.value;

        if (!username || !password) {
          showAlert('Please enter both username and password.');
          return;
        }

        fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data.token) {
              localStorage.setItem('adminToken', result.data.token);
              showAlert('Access granted! Redirecting…', 'success');
              setTimeout(function () {
                window.location.href = '/dashboard.html';
              }, 800);
            } else {
              showAlert(result.data.message || 'Invalid credentials.');
            }
          })
          .catch(function (err) {
            console.error(err);
            showAlert('Server error. Try again.');
          });
      });
    });
  </script>
</body>
</html>
